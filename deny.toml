[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "mysql 28.0.3 requires rustls-pemfile 2.2.0; Rustls reports it as an unmaintained compatibility wrapper around rustls-pki-types. Keep this exception visible and revisit when mysql removes the dependency." },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
