[workspace]
members = ["ast", "lexer", "parser", "hir", "mir", "database", "mail", "runtime", "web", "forms", "cli"]
resolver = "2"

[workspace.package]
version = "1.2.21"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fs2 = "0.4.3"
num-bigint = "=0.4.8"
bytes = "1"
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
regex = "1.13"
toml = "0.8"
toml_edit = "=0.22.27"
glob = "0.3"
similar = "2.7"
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1.0"
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
postgres = { version = "0.19.12", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
webpki-roots = "1.0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2.0"
ureq = { version = "3.4.2", default-features = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots"] }
ring = "0.17.14"
subtle = "2.6.1"
zeroize = "1.9.0"
url = "2.5.8"
zelyra-ast = { path = "ast", version = "1.0" }
zelyra-lexer = { path = "lexer", version = "1.0" }
zelyra-parser = { path = "parser", version = "1.0" }
zelyra-hir = { path = "hir", version = "1.0" }
zelyra-mir = { path = "mir", version = "1.0" }
zelyra-database = { path = "database", version = "1.0" }
zelyra-mail = { path = "mail", version = "1.0" }
zelyra-runtime = { path = "runtime", version = "1.0" }
zelyra-web = { path = "web", version = "1.0" }
zelyra-forms = { path = "forms", version = "1.0" }
