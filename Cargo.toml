[workspace]
members = ["ast", "lexer", "parser", "hir", "database", "runtime", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zelyra-ast = { path = "ast" }
zelyra-lexer = { path = "lexer" }
zelyra-parser = { path = "parser" }
zelyra-hir = { path = "hir" }
zelyra-database = { path = "database" }
zelyra-runtime = { path = "runtime" }
