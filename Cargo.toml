[workspace]
members = ["ast", "lexer", "parser", "hir", "database", "runtime", "web", "forms", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.41"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde_json = "1.0"
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "3.4.2", default-features = true }
zelyra-ast = { path = "ast" }
zelyra-lexer = { path = "lexer" }
zelyra-parser = { path = "parser" }
zelyra-hir = { path = "hir" }
zelyra-database = { path = "database" }
zelyra-runtime = { path = "runtime" }
zelyra-web = { path = "web" }
zelyra-forms = { path = "forms" }
