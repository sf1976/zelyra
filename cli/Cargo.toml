[package]
name = "zelyra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zelyra"
path = "src/main.rs"

[dependencies]
fs2.workspace = true
rand_core.workspace = true
rpassword = "7"
semver.workspace = true
sha2.workspace = true
ring.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde_json.workspace = true
regex.workspace = true
toml.workspace = true
toml_edit.workspace = true
glob.workspace = true
similar.workspace = true
url.workspace = true
ureq.workspace = true
zelyra-ast.workspace = true
zelyra-database.workspace = true
zelyra-hir.workspace = true
zelyra-lexer.workspace = true
zelyra-parser.workspace = true
zelyra-runtime.workspace = true
zeroize.workspace = true
zelyra-mir.workspace = true
zelyra-mail.workspace = true
zelyra-web.workspace = true
zelyra-forms.workspace = true
rustyline = "15"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
