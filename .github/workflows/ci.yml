name: Zelyra CI

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows-updater:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check Windows CLI updater
        run: cargo check --locked -p zelyra-cli --all-targets
      - name: Test updater logic
        run: cargo test --locked -p zelyra-cli updater::tests

  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: zelyra_ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zelyra_ci
          POSTGRES_USER: zelyra_ci
          POSTGRES_PASSWORD: zelyra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zelyra_ci -d zelyra_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install database clients and curl
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client postgresql-client sqlite3 curl
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate source installer
        run: |
          bash -n install.sh
          ./install.sh --dry-run --no-rustup --no-path --root "$RUNNER_TEMP/zelyra-install"
          ./install.sh --release v0.2.0 --dry-run --no-path --root "$RUNNER_TEMP/zelyra-release-install"
      - name: Test deterministic release packaging
        run: python3 scripts/test_package_release.py
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build CLI for integration test
        run: cargo build -p zelyra-cli
      - name: Validate combined view showcase
        run: |
          target/debug/zelyra check examples/view_showcase.zyl --format=json > /tmp/zelyra-view-showcase.json
          python3 -c 'import json; data = json.load(open("/tmp/zelyra-view-showcase.json")); assert data["success"] is True'
      - name: Validate component slot example
        run: |
          target/debug/zelyra check examples/component_slots.zyl --format=json > /tmp/zelyra-component-slots.json
          python3 -c 'import json; data = json.load(open("/tmp/zelyra-component-slots.json")); assert data["success"] is True'
      - name: Check deterministic impact output
        run: |
          target/debug/zelyra impact examples/auth_crud_api.zyl --format=json > /tmp/zelyra-impact.json
          target/debug/zelyra impact examples/auth_crud_api.zyl --format=json > /tmp/zelyra-impact-second.json
          diff -u /tmp/zelyra-impact.json /tmp/zelyra-impact-second.json
      - name: Check deterministic edit preview
        run: |
          target/debug/zelyra edit --format=json examples/fibonacci_rename.json > /tmp/zelyra-edit.json
          target/debug/zelyra edit --format=json examples/fibonacci_rename.json > /tmp/zelyra-edit-second.json
          diff -u /tmp/zelyra-edit.json /tmp/zelyra-edit-second.json
      - name: Check Zelyra example formatting
        run: |
          for source_file in examples/*.zyl; do
            formatted_file="$(mktemp --suffix=.zyl)"
            cp "$source_file" "$formatted_file"
            target/debug/zelyra fmt "$formatted_file"
            target/debug/zelyra fmt "$formatted_file" --check
            rm "$formatted_file"
          done
      - name: Run generated-project MariaDB end-to-end test
        env:
          ZELYRA_GENERATED_E2E_ROOT_PASSWORD: root
          ZELYRA_GENERATED_E2E_DB_PORT: 3306
          ZELYRA_GENERATED_E2E_HOST_PORT: 18081
          ZELYRA_GENERATED_E2E_ADDRESS: 127.0.0.1:38520
          ZELYRA_BIN: target/debug/zelyra
        run: ./tests/generated-project-mariadb-e2e.sh
      - name: Run generated-project Docker end-to-end test
        env:
          ZELYRA_DOCKER_E2E_DB_HOST_PORT: 3309
          ZELYRA_DOCKER_E2E_HOST_PORT: 18082
          ZELYRA_DOCKER_E2E_WEB_PORT: 8081
          ZELYRA_DOCKER_E2E_ADDRESS: 127.0.0.1:18082
          ZELYRA_DOCKER_E2E_REF: ${{ github.head_ref || github.ref_name }}
          ZELYRA_BIN: target/debug/zelyra
        run: ./tests/generated-project-docker-e2e.sh
      - name: Run generated authentication project end-to-end test
        env:
          ZELYRA_GENERATED_AUTH_ROOT_PASSWORD: root
          ZELYRA_GENERATED_AUTH_DB_PORT: 3306
          ZELYRA_GENERATED_AUTH_GENERATED_DB_HOST_PORT: 3309
          ZELYRA_GENERATED_AUTH_ADDRESS: 127.0.0.1:38525
          ZELYRA_BIN: target/debug/zelyra
        run: ./tests/generated-project-auth-e2e.sh
      - name: Run generated business project end-to-end test
        env:
          ZELYRA_GENERATED_BUSINESS_ROOT_PASSWORD: root
          ZELYRA_GENERATED_BUSINESS_DB_PORT: 3306
          ZELYRA_GENERATED_BUSINESS_GENERATED_DB_HOST_PORT: 3309
          ZELYRA_GENERATED_BUSINESS_ADDRESS: 127.0.0.1:38530
          ZELYRA_BIN: target/debug/zelyra
        run: ./tests/generated-project-business-e2e.sh
      - name: Run MariaDB CRUD integration test
        env:
          DATABASE_URL: mariadb://root:root@127.0.0.1:3306/zelyra_ci
          ZELYRA_BIN: target/debug/zelyra
          ZELYRA_E2E_ADDRESS: 127.0.0.1:38500
        run: ./tests/mariadb-e2e.sh
      - name: Run SQLite schema integration test
        env:
          ZELYRA_BIN: target/debug/zelyra
        run: ./tests/sqlite-e2e.sh
      - name: Run database schema safety integration test
        env:
          ZELYRA_SCHEMA_SAFETY_MARIADB_URL: mariadb://root:root@127.0.0.1:3306/zelyra_ci
          ZELYRA_BIN: target/debug/zelyra
        run: bash ./tests/schema-safety-e2e.sh
      - name: Run PostgreSQL schema safety integration test
        env:
          DATABASE_URL: postgres://zelyra_ci:zelyra_ci@127.0.0.1:5432/zelyra_ci
          ZELYRA_BIN: target/debug/zelyra
        run: bash ./tests/postgres-schema-safety-e2e.sh
      - name: Create isolated tableview test database
        env:
          MYSQL_PWD: root
        run: mariadb --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names -e "CREATE DATABASE IF NOT EXISTS zelyra_tableview_ci"
      - name: Run MariaDB tableview integration test
        env:
          DATABASE_URL: mariadb://root:root@127.0.0.1:3306/zelyra_tableview_ci
          ZELYRA_BIN: target/debug/zelyra
          ZELYRA_TABLEVIEW_E2E_ADDRESS: 127.0.0.1:38515
        run: ./tests/mariadb-tableview-e2e.sh
      - name: Create isolated customer-order test database
        env:
          MYSQL_PWD: root
        run: mariadb --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names -e "CREATE DATABASE IF NOT EXISTS zelyra_customer_orders_ci"
      - name: Run customer-order acceptance application test
        env:
          DATABASE_URL: mariadb://root:root@127.0.0.1:3306/zelyra_customer_orders_ci
          ZELYRA_BIN: target/debug/zelyra
          ZELYRA_TABLEVIEW_E2E_ADDRESS: 127.0.0.1:38516
          ZELYRA_TABLEVIEW_E2E_PROJECT: examples/customer_orders.zyl
          ZELYRA_TABLEVIEW_E2E_PATH: /views/customerorderoverview
          ZELYRA_TABLEVIEW_E2E_EXPECT_CUSTOM_APP: "1"
        run: ./tests/mariadb-tableview-e2e.sh
      - name: Run MariaDB authentication integration test
        env:
          DATABASE_URL: mariadb://root:root@127.0.0.1:3306/zelyra_ci
          ZELYRA_AUTH_DB_PASSWORD: root
          ZELYRA_BIN: target/debug/zelyra
          ZELYRA_AUTH_E2E_ADDRESS: 127.0.0.1:38505
        run: ./tests/mariadb-auth-e2e.sh
      - name: Run protected CRUD and API integration test
        env:
          DATABASE_URL: mariadb://root:root@127.0.0.1:3306/zelyra_ci
          ZELYRA_PROTECTED_E2E_DB_PASSWORD: root
          ZELYRA_BIN: target/debug/zelyra
          ZELYRA_PROTECTED_E2E_ADDRESS: 127.0.0.1:38510
        run: ./tests/mariadb-protected-e2e.sh
  mariadb-compatibility:
    name: MariaDB ${{ matrix.version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["10.11.19", "11.4.13", "11.8.9", "12.3.3"]
    services:
      mariadb:
        image: mariadb:${{ matrix.version }}
        env:
          MARIADB_DATABASE: zelyra_ci
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install MariaDB client and curl
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client curl
      - name: Build Zelyra CLI
        run: cargo build -p zelyra-cli
      - name: Verify MariaDB server version
        env:
          MYSQL_PWD: root
        run: |
          expected_version='${{ matrix.version }}'
          server_version="$(mariadb --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names -e 'SELECT VERSION()')"
          case "${server_version}" in
            "${expected_version}"*) ;;
            *) echo "Expected MariaDB ${expected_version}, got ${server_version}" >&2; exit 1 ;;
          esac
          echo "Testing MariaDB ${server_version}"
          docker image inspect "mariadb:${expected_version}" --format '{{json .RepoDigests}}'
      - name: Run MariaDB database and CRUD HTTP integration
        env:
          DATABASE_URL: mariadb://root:root@127.0.0.1:3306/zelyra_ci
          ZELYRA_E2E_DB_PASSWORD: root
          ZELYRA_BIN: target/debug/zelyra
          ZELYRA_E2E_ADDRESS: 127.0.0.1:38500
        run: ./tests/mariadb-e2e.sh
      - name: Run destructive schema approval integration
        env:
          ZELYRA_SCHEMA_SAFETY_MARIADB_URL: mariadb://root:root@127.0.0.1:3306/zelyra_ci
          ZELYRA_BIN: target/debug/zelyra
        run: bash ./tests/schema-safety-e2e.sh
      - name: Validate Handbook Code Snippets
        run: python3 scripts/validate_handbook.py
