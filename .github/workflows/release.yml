name: Zelyra Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/src/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag used to name validation artifacts; manual runs never publish a release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          case "${EVENT_NAME}" in
            push)
              release_tag="${EVENT_REF}"
              ;;
            pull_request)
              version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
              release_tag="v${version}"
              ;;
            workflow_dispatch)
              release_tag="${INPUT_RELEASE_TAG}"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          .\install.ps1 -DryRun -NoRustup -NoPath
          .\install.ps1 -DryRun -Release $env:RELEASE_TAG -NoPath
      - name: Build release binary
        run: cargo build --release --package zelyra-cli --target ${{ matrix.target }}
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          package="zelyra-${RELEASE_TAG}-${TARGET}"
          update_binary="zelyra-${RELEASE_TAG}-${TARGET}.bin"
          mkdir "${package}"
          cp "target/${TARGET}/release/zelyra" "${package}/zelyra"
          cp "target/${TARGET}/release/zelyra" "${update_binary}"
          sha256sum "${update_binary}" > "${update_binary}.sha256"
          cp README.md README.de.md LICENSE LICENSE-MIT "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $package = "zelyra-$env:RELEASE_TAG-$env:TARGET"
          $updateBinary = "$package.exe"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target/$env:TARGET/release/zelyra.exe" "$package/zelyra.exe"
          Copy-Item "target/$env:TARGET/release/zelyra.exe" $updateBinary
          (Get-FileHash $updateBinary -Algorithm SHA256).Hash.ToLower() + "  $updateBinary" |
            Set-Content -Encoding ascii "$updateBinary.sha256"
          Copy-Item README.md, README.de.md, LICENSE, LICENSE-MIT $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
          (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLower() + "  $package.zip" |
            Set-Content "$package.zip.sha256"
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: zelyra-${{ matrix.target }}
          path: |
            zelyra-*.tar.gz
            zelyra-*.tar.gz.sha256
            zelyra-*.zip
            zelyra-*.zip.sha256
            zelyra-*-x86_64-unknown-linux-gnu.bin
            zelyra-*-x86_64-unknown-linux-gnu.bin.sha256
            zelyra-*-x86_64-pc-windows-msvc.exe
            zelyra-*-x86_64-pc-windows-msvc.exe.sha256

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
          generate_release_notes: true
          body: |
            ## Zelyra 0.1 Alpha

            This is an early alpha release. Do not use it for production.

            ## Zelyra 0.1 Alpha (Deutsch)

            Dies ist eine frühe Alpha-Version. Nicht für Produktivsysteme verwenden.
          files: release-assets/*
