name: Zelyra Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/src/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag used to name validation artifacts; manual runs never publish a release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          case "${EVENT_NAME}" in
            push)
              release_tag="${EVENT_REF}"
              ;;
            pull_request)
              version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
              release_tag="v${version}"
              ;;
            workflow_dispatch)
              release_tag="${INPUT_RELEASE_TAG}"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${package_version}"
          if [[ "${release_tag}" != "${expected_tag}" && "${release_tag}" != "${expected_tag}-"* ]]; then
            echo "Release tag ${release_tag} does not match Cargo.toml version ${package_version}." >&2
            exit 1
          fi

          python3 scripts/check_release_metadata.py --tag "${release_tag}"
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Install pinned Python for Linux packaging
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Install pinned Python for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          .\install.ps1 -DryRun -NoRustup -NoPath
          .\install.ps1 -DryRun -Release $env:RELEASE_TAG -NoPath
      - name: Build release binary
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C link-arg=/Brepro
        run: cargo build --locked --release --package zelyra-cli --target ${{ matrix.target }}
      - name: Build release binary
        if: runner.os == 'Linux'
        run: cargo build --locked --release --package zelyra-cli --target ${{ matrix.target }}
      - name: Verify repeated release binary build
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/zelyra-repeat-build
        run: |
          first_binary="target/${TARGET}/release/zelyra"
          second_binary="${CARGO_TARGET_DIR}/${TARGET}/release/zelyra"
          cargo build --locked --release --package zelyra-cli --target "${TARGET}"
          cmp "${first_binary}" "${second_binary}"
      - name: Verify repeated release binary build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/zelyra-repeat-build
          RUSTFLAGS: -C link-arg=/Brepro
        run: |
          $firstBuild = "target/$env:TARGET/release/zelyra.exe"
          $secondBuild = "$env:CARGO_TARGET_DIR/$env:TARGET/release/zelyra.exe"
          cargo build --locked --release --package zelyra-cli --target $env:TARGET
          $firstHash = (Get-FileHash $firstBuild -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash $secondBuild -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) {
            throw "Release binary differs between repeated builds (first: $firstHash; second: $secondHash)."
          }
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          python3 scripts/package_release.py \
            --project-root . \
            --binary "target/${TARGET}/release/zelyra" \
            --output-dir release-out \
            --platform linux \
            --tag "${RELEASE_TAG}" \
            --target "${TARGET}" \
            --source-date-epoch "${source_date_epoch}"
      - name: Verify Linux release artifacts
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/verify_release_artifacts.py \
            --directory release-out \
            --platform linux \
            --tag "${RELEASE_TAG}" \
            --target "${TARGET}" \
            --run-binary
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $sourceDateEpoch = [long](git log -1 --format=%ct)
          python scripts/package_release.py `
            --project-root . `
            --binary "target/$env:TARGET/release/zelyra.exe" `
            --output-dir release-out `
            --platform windows `
            --tag $env:RELEASE_TAG `
            --target $env:TARGET `
            --source-date-epoch $sourceDateEpoch
      - name: Verify Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/verify_release_artifacts.py `
            --directory release-out `
            --platform windows `
            --tag $env:RELEASE_TAG `
            --target $env:TARGET `
            --run-binary
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: zelyra-${{ matrix.target }}
          path: release-out/*

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
          generate_release_notes: true
          body: |
            ## Zelyra ${{ needs.validate.outputs.release_tag }}

            This is an experimental release. Do not use it for production.

            ## Zelyra ${{ needs.validate.outputs.release_tag }} (Deutsch)

            Dies ist eine experimentelle Version. Nicht für Produktivsysteme verwenden.
          files: release-assets/*
