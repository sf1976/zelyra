name: Zelyra Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '**/src/**'
      - 'scripts/generate_sbom.py'
      - 'scripts/verify_sbom.py'
      - 'scripts/check_release_readiness.py'
      - 'scripts/test_release_readiness.py'
      - 'docs/release-plans/0.4.0.en.md'
      - 'docs/release-plans/0.4.0.de.md'
      - 'docs/release-notes/0.4.0.en.md'
      - 'docs/release-notes/0.4.0.de.md'
      - 'docs/release-readiness/0.4.0-human-acceptance.en.md'
      - 'docs/release-readiness/0.4.0-human-acceptance.de.md'
      - 'docs/release-readiness/0.4.0-candidate-verification.md'
      - 'docs/release-plans/0.5.0.en.md'
      - 'docs/release-plans/0.5.0.de.md'
      - 'docs/release-plans/0.7.0.*.md'
      - 'docs/release-plans/0.8.0.*.md'
      - 'docs/release-plans/0.9.0.*.md'
      - 'docs/release-plans/0.9.5.*.md'
      - 'docs/release-plans/0.9.4.*.md'
      - 'docs/release-plans/0.9.8.*.md'
      - 'docs/release-plans/0.9.9.*.md'
      - 'docs/release-notes/0.9.4.*.md'
      - 'docs/release-readiness/0.9.4-*.md'
      - 'docs/implemented.en.md'
      - 'docs/implemented.de.md'
      - 'docs/release-notes/0.5.0.en.md'
      - 'docs/release-notes/0.5.0.de.md'
      - 'docs/release-readiness/0.5.0-human-acceptance.en.md'
      - 'docs/release-readiness/0.5.0-human-acceptance.de.md'
      - 'docs/release-readiness/0.5.0-onboarding-study.en.md'
      - 'docs/release-readiness/0.5.0-onboarding-study.de.md'
      - 'docs/release-readiness/0.5.0-candidate-verification.md'
      - 'docs/release-readiness/0.5.0-risk-register.en.md'
      - 'docs/release-readiness/0.5.0-risikoregister.de.md'
      - 'docs/release-plans/1.0.0.en.md'
      - 'docs/release-plans/1.0.0.de.md'
      - 'docs/release-readiness/1.0.0-human-acceptance.en.md'
      - 'docs/release-readiness/1.0.0-human-acceptance.de.md'
      - 'docs/release-readiness/1.0.0-onboarding-study.en.md'
      - 'docs/release-readiness/1.0.0-onboarding-study.de.md'
      - 'docs/release-plans/1.0.6-zelyra-ui-progress.en.md'
      - 'docs/release-plans/1.0.6-zelyra-ui-progress.de.md'
      - 'docs/release-notes/1.0.6.en.md'
      - 'docs/release-notes/1.0.6.de.md'
      - 'docs/release-plans/1.0.7-language-runtime-progress.en.md'
      - 'docs/release-plans/1.0.7-language-runtime-progress.de.md'
      - 'docs/release-notes/1.0.7.en.md'
      - 'docs/release-notes/1.0.7.de.md'
      - 'docs/release-notes/1.1.5.*.md'
      - 'docs/release-plans/1.1.5.*.md'
      - 'docs/packages.*.md'
      - 'docs/handbook/en/textbook-foundations.md'
      - 'docs/handbook/de/lehrbuch-grundlagen.md'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag used to name validation artifacts; manual runs never publish a release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          case "${EVENT_NAME}" in
            push)
              release_tag="${EVENT_REF}"
              ;;
            pull_request)
              version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
              release_tag="v${version}"
              ;;
            workflow_dispatch)
              release_tag="${INPUT_RELEASE_TAG}"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${package_version}"
          if [[ "${release_tag}" != "${expected_tag}" && "${release_tag}" != "${expected_tag}-"* ]]; then
            echo "Release tag ${release_tag} does not match Cargo.toml version ${package_version}." >&2
            exit 1
          fi

          python3 scripts/check_release_metadata.py --tag "${release_tag}"
          if [[ "${release_tag}" == "v${package_version}" && "${EVENT_NAME}" != "pull_request" ]]; then
            if [[ "${package_version}" == "0.4.0" || "${package_version}" == "0.5.0" || "${package_version}" == "1.0.0" ]]; then
              candidate_tag="$(python3 scripts/check_release_readiness.py \
                --version "${package_version}" --print-candidate-tag)"
              candidate_commit="$(git rev-parse "refs/tags/${candidate_tag}^{commit}")"
              python3 scripts/check_release_readiness.py \
                --version "${package_version}" --candidate-commit "${candidate_commit}"
            else
              python3 scripts/check_release_readiness.py --version "${package_version}"
            fi
          fi
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Install pinned Python for Linux packaging
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Install pinned Python for Windows packaging
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          .\install.ps1 -DryRun -NoRustup -NoPath
          .\install.ps1 -DryRun -Release $env:RELEASE_TAG -NoPath
      - name: Build release binary
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C link-arg=/Brepro
        run: cargo build --locked --release --package zelyra-cli --target ${{ matrix.target }}
      - name: Build release binary
        if: runner.os == 'Linux'
        run: cargo build --locked --release --package zelyra-cli --target ${{ matrix.target }}
      - name: Verify repeated release binary build
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/zelyra-repeat-build
        run: |
          first_binary="target/${TARGET}/release/zelyra"
          second_binary="${CARGO_TARGET_DIR}/${TARGET}/release/zelyra"
          cargo build --locked --release --package zelyra-cli --target "${TARGET}"
          cmp "${first_binary}" "${second_binary}"
      - name: Verify repeated release binary build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/zelyra-repeat-build
          RUSTFLAGS: -C link-arg=/Brepro
        run: |
          $firstBuild = "target/$env:TARGET/release/zelyra.exe"
          $secondBuild = "$env:CARGO_TARGET_DIR/$env:TARGET/release/zelyra.exe"
          cargo build --locked --release --package zelyra-cli --target $env:TARGET
          $firstHash = (Get-FileHash $firstBuild -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash $secondBuild -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) {
            throw "Release binary differs between repeated builds (first: $firstHash; second: $secondHash)."
          }
      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          python3 scripts/package_release.py \
            --project-root . \
            --binary "target/${TARGET}/release/zelyra" \
            --output-dir release-out \
            --platform linux \
            --tag "${RELEASE_TAG}" \
            --target "${TARGET}" \
            --source-date-epoch "${source_date_epoch}"
      - name: Verify Linux release artifacts
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/verify_release_artifacts.py \
            --directory release-out \
            --platform linux \
            --tag "${RELEASE_TAG}" \
            --target "${TARGET}" \
            --run-binary
      - name: Generate and verify Linux SBOM
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          source_date_epoch="$(git log -1 --format=%ct)"
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/zelyra-cargo-metadata.json"
          sbom="release-out/zelyra-${RELEASE_TAG}-${TARGET}.spdx.json"
          python3 scripts/generate_sbom.py \
            --metadata "${RUNNER_TEMP}/zelyra-cargo-metadata.json" \
            --binary "target/${TARGET}/release/zelyra" \
            --output "${sbom}" --tag "${RELEASE_TAG}" --target "${TARGET}" \
            --source-date-epoch "${source_date_epoch}"
          python3 scripts/verify_sbom.py --sbom "${sbom}" \
            --binary "target/${TARGET}/release/zelyra" --tag "${RELEASE_TAG}" --target "${TARGET}"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $sourceDateEpoch = [long](git log -1 --format=%ct)
          python scripts/package_release.py `
            --project-root . `
            --binary "target/$env:TARGET/release/zelyra.exe" `
            --output-dir release-out `
            --platform windows `
            --tag $env:RELEASE_TAG `
            --target $env:TARGET `
            --source-date-epoch $sourceDateEpoch
      - name: Verify Windows release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/verify_release_artifacts.py `
            --directory release-out `
            --platform windows `
            --tag $env:RELEASE_TAG `
            --target $env:TARGET `
            --run-binary
      - name: Generate and verify Windows SBOM
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $sourceDateEpoch = [long](git log -1 --format=%ct)
          cargo metadata --locked --format-version 1 | Set-Content -Path "$env:RUNNER_TEMP/zelyra-cargo-metadata.json" -Encoding utf8NoBOM
          $sbom = "release-out/zelyra-$env:RELEASE_TAG-$env:TARGET.spdx.json"
          python scripts/generate_sbom.py `
            --metadata "$env:RUNNER_TEMP/zelyra-cargo-metadata.json" `
            --binary "target/$env:TARGET/release/zelyra.exe" `
            --output $sbom --tag $env:RELEASE_TAG --target $env:TARGET `
            --source-date-epoch $sourceDateEpoch
          python scripts/verify_sbom.py --sbom $sbom `
            --binary "target/$env:TARGET/release/zelyra.exe" `
            --tag $env:RELEASE_TAG --target $env:TARGET
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: zelyra-${{ matrix.target }}
          path: release-out/*

  attest:
    name: Attest ${{ matrix.target }} release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: zelyra-${{ matrix.target }}
          path: release-assets
      - name: Attest release archive and SBOM
        uses: actions/attest@v4
        with:
          subject-path: release-assets/zelyra-${{ needs.validate.outputs.release_tag }}-${{ matrix.target }}.${{ matrix.archive }}
          sbom-path: release-assets/zelyra-${{ needs.validate.outputs.release_tag }}-${{ matrix.target }}.spdx.json

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.release_tag }}
          prerelease: ${{ contains(needs.validate.outputs.release_tag, '-') }}
          generate_release_notes: true
          body: |
            ## Zelyra ${{ needs.validate.outputs.release_tag }}

            ${{ startsWith(needs.validate.outputs.release_tag, 'v1.') && !contains(needs.validate.outputs.release_tag, '-') && 'This is a stable release in the 1.x series.' || 'This is an experimental release. Do not use it for production.' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.2' && '[English release notes](https://github.com/sf1976/zelyra/blob/v1.0.2/docs/release-notes/1.0.2.en.md)' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.6' && '[English release notes](https://github.com/sf1976/zelyra/blob/v1.0.6/docs/release-notes/1.0.6.en.md)' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.7' && '[English release notes](https://github.com/sf1976/zelyra/blob/v1.0.7/docs/release-notes/1.0.7.en.md)' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.0' && 'Studio release: offline embedded CodeMirror 6, shared compiler services and standalone LSP, semantic editing, PDF/outbox tools, and checked string interpolation and mutable arrays. See the [English release notes](https://github.com/sf1976/zelyra/blob/v1.1.0/docs/release-notes/1.1.0.en.md). Linux and Windows archives include SHA-256 sidecars and SPDX SBOMs.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.0' && 'Install on Linux/macOS: `./install.sh --release v1.1.0`. Install on Windows: `.\install.ps1 -Release v1.1.0`. Release assets and SHA-256 files are attached below.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.1' && 'Studio fixes: expected browser disconnects no longer appear as errors, successful server startup is informational, Canvas clearly distinguishes static inspection from the running web application, Outbox connection/setup messages explain when Outbox is optional, and `zelyra serve` selects a free local port when its requested port is busy. See the [English release notes](https://github.com/sf1976/zelyra/blob/v1.1.1/docs/release-notes/1.1.1.en.md). Linux and Windows archives include SHA-256 sidecars and SPDX SBOMs.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.1' && 'Install on Linux/macOS: `./install.sh --release v1.1.1`. Install on Windows: `.\install.ps1 -Release v1.1.1`. Release assets and SHA-256 files are attached below.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.5' && 'Offline reusable local packages: semver compatibility checks, deterministic locks, explicit package imports, package inventory/planning/bundling, typed settings, and the new `zelyra module init` scaffold. Includes reusable bounded CSV import/export examples. See the [English release notes](https://github.com/sf1976/zelyra/blob/v1.1.5/docs/release-notes/1.1.5.en.md). Publisher signatures/registry, ODBC, Excel export, graphical PDF, and full MIR/Bytecode parity are not included. Linux and Windows archives include SHA-256 sidecars and SPDX SBOMs.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.5' && 'Install on Linux/macOS: `./install.sh --release v1.1.5`. Install on Windows: `.\install.ps1 -Release v1.1.5`. Release assets and SHA-256 files are attached below.' || '' }}

            ## Zelyra ${{ needs.validate.outputs.release_tag }} (Deutsch)

            ${{ startsWith(needs.validate.outputs.release_tag, 'v1.') && !contains(needs.validate.outputs.release_tag, '-') && 'Dies ist ein stabiles Release der 1.x-Serie.' || 'Dies ist eine experimentelle Version. Nicht für Produktivsysteme verwenden.' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.2' && '[Deutsche Release-Hinweise](https://github.com/sf1976/zelyra/blob/v1.0.2/docs/release-notes/1.0.2.de.md)' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.6' && '[Deutsche Release-Hinweise](https://github.com/sf1976/zelyra/blob/v1.0.6/docs/release-notes/1.0.6.de.md)' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.7' && '[Deutsche Release-Hinweise](https://github.com/sf1976/zelyra/blob/v1.0.7/docs/release-notes/1.0.7.de.md)' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.0' && 'Studio-Release: offlinefähiges, eingebettetes CodeMirror 6, gemeinsame Compiler-Sprachdienste und eigenständiger LSP, semantische Änderungen, PDF-/Outbox-Werkzeuge sowie geprüfte Stringinterpolation und veränderliche Arrays. Siehe die [deutschen Release-Hinweise](https://github.com/sf1976/zelyra/blob/v1.1.0/docs/release-notes/1.1.0.de.md). Linux- und Windows-Archive enthalten SHA-256-Dateien und SPDX-SBOMs.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.0' && 'Installation unter Linux/macOS: `./install.sh --release v1.1.0`. Installation unter Windows: `.\install.ps1 -Release v1.1.0`. Release-Artefakte und SHA-256-Dateien sind unten angehängt.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.1' && 'Studio-Korrekturen: erwartete Browserabbrüche erscheinen nicht mehr als Fehler, der erfolgreiche Serverstart wird als Information protokolliert, Canvas unterscheidet klar zwischen statischer Prüfvorschau und laufender Webanwendung, Outbox-Hinweise erklären Voraussetzungen und optionale Nutzung, und `zelyra serve` wählt bei belegtem Port einen freien lokalen Port. Siehe die [deutschen Release-Hinweise](https://github.com/sf1976/zelyra/blob/v1.1.1/docs/release-notes/1.1.1.de.md). Linux- und Windows-Archive enthalten SHA-256-Dateien und SPDX-SBOMs.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.1' && 'Installation unter Linux/macOS: `./install.sh --release v1.1.1`. Installation unter Windows: `.\install.ps1 -Release v1.1.1`. Release-Artefakte und SHA-256-Dateien sind unten angehängt.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.5' && 'Offline wiederverwendbare lokale Pakete: SemVer-Kompatibilitätsprüfung, deterministische Lockfiles, ausdrückliche Paketimporte, Paketübersicht/-planung/-bundles, typisierte Einstellungen und das neue Gerüst `zelyra module init`. Dazu kommen begrenzte CSV-Import-/Export-Beispiele. Siehe die [deutschen Release-Hinweise](https://github.com/sf1976/zelyra/blob/v1.1.5/docs/release-notes/1.1.5.de.md). Registry/Signaturen, ODBC, Excel-Export, grafisches PDF und vollständige MIR-/Bytecodeparität sind nicht enthalten. Linux- und Windows-Archive enthalten SHA-256-Dateien und SPDX-SBOMs.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.1.5' && 'Installation unter Linux/macOS: `./install.sh --release v1.1.5`. Installation unter Windows: `.\install.ps1 -Release v1.1.5`. Release-Artefakte und SHA-256-Dateien sind unten angehängt.' || '' }}

            ${{ needs.validate.outputs.release_tag == 'v0.3.0' && 'No independent human onboarding study was conducted for 0.3.0. The project owner explicitly deferred it to 0.4.0; this is not usability evidence. See the [decision record](https://github.com/sf1976/zelyra/blob/v0.3.0/docs/release-readiness/0.3.0-human-gate-decision.en.md).' || '' }}

            ${{ needs.validate.outputs.release_tag == 'v0.3.0' && 'Für 0.3.0 wurde keine unabhängige menschliche Einsteigerstudie durchgeführt. Der Projektverantwortliche hat sie ausdrücklich auf 0.4.0 vertagt; dies ist kein Nachweis der Nutzerfreundlichkeit. Siehe das [Entscheidungsprotokoll](https://github.com/sf1976/zelyra/blob/v0.3.0/docs/release-readiness/0.3.0-human-gate-decision.de.md).' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v0.4.0' && 'No independent human acceptance study was conducted for 0.4.0. The project owner explicitly deferred it to mandatory 0.5.0; this is not acceptance evidence. See the [tag-pinned decision record](https://github.com/sf1976/zelyra/blob/v0.4.0/docs/release-readiness/0.4.0-human-acceptance.en.md).' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v0.4.0' && 'Für 0.4.0 wurde keine unabhängige menschliche Abnahmestudie durchgeführt. Der Projektverantwortliche hat sie ausdrücklich auf das verpflichtende 0.5.0 verschoben; dies ist kein Abnahmenachweis. Siehe das [taggebundene Entscheidungsprotokoll](https://github.com/sf1976/zelyra/blob/v0.4.0/docs/release-readiness/0.4.0-human-acceptance.de.md).' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v0.5.0' && 'By explicit project-owner decision, independent human acceptance was deferred to the first major release, 1.0.0. No human study was conducted for 0.5.0; the [tag-pinned decision record](https://github.com/sf1976/zelyra/blob/v0.5.0/docs/release-readiness/0.5.0-human-acceptance.en.md) is not test evidence.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v0.5.0' && 'Auf ausdrückliche Entscheidung des Projektverantwortlichen wurde die unabhängige menschliche Abnahme auf die erste große Veröffentlichung 1.0.0 verschoben. Für 0.5.0 fand keine menschliche Studie statt; der [taggebundene Entscheidungsnachweis](https://github.com/sf1976/zelyra/blob/v0.5.0/docs/release-readiness/0.5.0-human-acceptance.de.md) ist kein Testnachweis.' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.0' && 'Independent human acceptance was completed against the published 1.0.0 candidate. See the [tag-pinned acceptance record](https://github.com/sf1976/zelyra/blob/v1.0.0/docs/release-readiness/1.0.0-human-acceptance.en.md).' || '' }}
            ${{ needs.validate.outputs.release_tag == 'v1.0.0' && 'Die unabhängige menschliche Abnahme wurde anhand des veröffentlichten 1.0.0-Kandidaten abgeschlossen. Siehe das [taggebundene Abnahmeprotokoll](https://github.com/sf1976/zelyra/blob/v1.0.0/docs/release-readiness/1.0.0-human-acceptance.de.md).' || '' }}
          files: release-assets/*
